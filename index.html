<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hi, Princess 👑</title>
<style>
  :root{
    --bg1:#1a0510;
    --bg2:#2b0a1a;
    --burgundy:#7a1030;
    --pink:#ff6fa5;
    --gold:#e8b98a;
    --glass:rgba(255,255,255,0.07);
    --glass-border:rgba(255,255,255,0.18);
    --text:#f6e9ee;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    overflow-x:hidden;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,111,165,0.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(122,16,48,0.35), transparent 45%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--text);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{
    display:none;
    min-height:100vh;
    width:100%;
    position:relative;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .page.active{display:flex;}
  .page.show{opacity:1;transform:translateY(0);}

  /* particles */
  .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,210,0.9), rgba(255,180,210,0));
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) scale(1);opacity:0;}
    10%{opacity:.8;}
    90%{opacity:.6;}
    100%{transform:translateY(-110vh) translateX(20px) scale(0.6);opacity:0;}
  }
  .heart-particle{
    position:absolute;
    bottom:-30px;
    font-size:14px;
    color:var(--pink);
    opacity:.6;
    animation:floatUp linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,111,165,0.6));
  }

  /* LOADING PAGE */
  #loading{z-index:5;}
  .loading-inner{position:relative;z-index:2;}
  .typing-text{
    font-size:clamp(28px,7vw,46px);
    font-weight:300;
    letter-spacing:1px;
    color:var(--text);
    min-height:60px;
    text-shadow:0 0 25px rgba(255,111,165,0.4);
  }
  .cursor{
    display:inline-block;
    width:2px;
    background:var(--pink);
    margin-inline-start:3px;
    animation:blink 0.9s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .loading-ring{
    width:46px;height:46px;
    margin:34px auto 0;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--pink);
    animation:spin 1s linear infinite;
    opacity:0;
    transition:opacity .6s ease;
  }
  .loading-ring.show{opacity:1;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* GLASS CARD */
  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:30px 24px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(30px) scale(.96);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .photo-wrap{
    width:150px;height:150px;
    margin:0 auto 20px;
    border-radius:20px;
    padding:4px;
    background:linear-gradient(135deg, var(--pink), var(--burgundy));
    box-shadow:0 0 30px rgba(255,111,165,0.45);
    animation:photoPop 1s cubic-bezier(.2,.8,.2,1) .2s both;
  }
  @keyframes photoPop{
    from{opacity:0;transform:scale(.7) rotate(-8deg);}
    to{opacity:1;transform:scale(1) rotate(0);}
  }
  .photo-wrap img{
    width:100%;height:100%;
    object-fit:cover;
    border-radius:16px;
    display:block;
    background:#3a1220;
  }

  .card h1{
    font-size:clamp(22px,5.5vw,28px);
    font-weight:600;
    margin-bottom:22px;
    color:var(--text);
    line-height:1.5;
  }
  .card p.sub{
    font-size:15px;
    color:rgba(246,233,238,0.75);
    margin-bottom:20px;
    line-height:1.7;
  }

  .btn-row{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    position:relative;
    min-height:60px;
  }
  button{
    font-family:inherit;
    font-size:16px;
    border:none;
    cursor:pointer;
    outline:none;
  }
  .btn{
    padding:14px 28px;
    border-radius:50px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg, var(--pink), var(--burgundy));
    box-shadow:0 8px 25px rgba(255,111,165,0.35);
    transition:transform .2s ease, box-shadow .2s ease;
    min-width:110px;
  }
  .btn:active{transform:scale(0.95);}
  .btn-yes{}
  .btn-no{
    background:rgba(255,255,255,0.08);
    color:var(--text);
    border:1px solid var(--glass-border);
    box-shadow:none;
    position:relative;
    transition:transform .18s ease;
  }
  .btn-ghost{
    margin-top:22px;
    background:transparent;
    border:1px solid var(--glass-border);
    color:var(--text);
    padding:12px 26px;
    border-radius:50px;
    font-size:14px;
    opacity:.85;
    transition:transform .2s ease, opacity .2s;
  }
  .btn-ghost:active{transform:scale(.95);}

  /* ENVELOPE */
  .envelope-zone{
    position:relative;
    width:260px;
    height:180px;
    margin:10px auto 24px;
    cursor:pointer;
    perspective:1000px;
  }
  .envelope-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#3a0f22,#57132c);
    border-radius:12px;
    box-shadow:0 20px 40px rgba(0,0,0,0.55);
    overflow:visible;
  }
  .envelope-flap{
    position:absolute;
    top:0;left:0;right:0;
    height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-top:95px solid #7a1c3c;
    transform-origin:top;
    transition:transform .8s cubic-bezier(.4,.2,.2,1);
    z-index:3;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4));
  }
  .envelope-zone.open .envelope-flap{transform:rotateX(180deg);}
  .envelope-seal{
    position:absolute;
    top:36px;left:50%;
    transform:translateX(-50%);
    width:42px;height:42px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ff8fb5, var(--burgundy));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    z-index:4;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    transition:opacity .3s ease, transform .3s ease;
  }
  .envelope-zone.open .envelope-seal{opacity:0;transform:translateX(-50%) scale(0.4);}
  .envelope-paper{
    position:absolute;
    left:14px;right:14px;
    bottom:10px;
    height:70%;
    background:linear-gradient(180deg,#fdf6ee,#f4e7d8);
    border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    z-index:2;
    transition:transform .9s cubic-bezier(.3,.6,.2,1);
  }
  .envelope-zone.open .envelope-paper{
    transform:translateY(-165px) scale(1.05);
  }
  .envelope-hint{
    margin-top:14px;
    font-size:15px;
    color:rgba(246,233,238,0.8);
  }

  /* LETTER PAPER */
  .letter-paper{
    display:none;
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    max-height:72vh;
    background:linear-gradient(180deg,#fdf6ee,#f2e4d3);
    color:#3a1220;
    border-radius:10px;
    padding:26px 22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    text-align:right;
    animation:unfold .9s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
    line-height:1.9;
    font-size:16px;
  }
  .letter-paper.show{display:block;}
  @keyframes unfold{
    from{opacity:0;transform:scaleY(0.3) translateY(-20px);}
    to{opacity:1;transform:scaleY(1) translateY(0);}
  }
  .letter-paper .signature{
    margin-top:18px;
    font-weight:600;
    color:var(--burgundy);
  }

  /* MUSIC PAGE */
  .music-icon{
    width:110px;height:110px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--burgundy));
    display:flex;align-items:center;justify-content:center;
    font-size:44px;
    box-shadow:0 0 40px rgba(255,111,165,0.4);
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 25px rgba(255,111,165,0.35);}
    50%{box-shadow:0 0 45px rgba(255,111,165,0.65);}
  }
  .music-icon.playing{animation:pulseGlow 1.1s ease-in-out infinite, spin 8s linear infinite;}
  .song-title{font-size:18px;font-weight:600;margin-bottom:18px;}
  .play-btn{
    width:64px;height:64px;
    border-radius:50%;
    background:var(--text);
    color:var(--burgundy);
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    transition:transform .2s ease;
  }
  .play-btn:active{transform:scale(0.92);}
  .bars{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:24px;margin-bottom:22px;}
  .bar{width:4px;background:var(--pink);border-radius:2px;height:6px;transition:height .2s ease;}
  .bars.playing .bar{animation:bar 1s ease-in-out infinite;}
  .bar:nth-child(1){animation-delay:0s;}
  .bar:nth-child(2){animation-delay:.15s;}
  .bar:nth-child(3){animation-delay:.3s;}
  .bar:nth-child(4){animation-delay:.1s;}
  .bar:nth-child(5){animation-delay:.25s;}
  @keyframes bar{
    0%,100%{height:6px;}
    50%{height:22px;}
  }

  .bouquet-wrap{
    width:100%;
    max-width:260px;
    margin:6px auto 0;
    animation:bouquetIn 1.1s cubic-bezier(.2,.8,.2,1) both;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }
  .bouquet-svg{width:100%;height:auto;display:block;}
  @keyframes bouquetIn{
    from{opacity:0;transform:translateY(24px) scale(.85) rotate(-4deg);}
    to{opacity:1;transform:translateY(0) scale(1) rotate(0);}
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    width:8px;height:14px;
    z-index:50;
    opacity:.9;
    pointer-events:none;
  }
  @keyframes confettiFall{
    to{transform:translateY(110vh) rotate(540deg);opacity:0;}
  }

  @media (max-width:380px){
    .envelope-zone{width:220px;height:155px;}
    .envelope-flap{border-left-width:110px;border-right-width:110px;border-top-width:80px;}
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<!-- PAGE 1: LOADING -->
<div class="page active" id="loading">
  <div class="loading-inner">
    <div class="typing-text" id="typingText"><span id="typingContent"></span><span class="cursor" id="cursor">&nbsp;</span></div>
    <div class="loading-ring" id="loadingRing"></div>
  </div>
</div>

<!-- PAGE 2: HOME / APOLOGY -->
<div class="page" id="home">
  <div class="card">
    <div class="photo-wrap"><img src="a1836dc0ec8c9109cdcb37a5f0f05145.jpg" alt="Our Photo"></div>
    <h1>Will you miss me ? princess</h1>
    <div class="btn-row" id="btnRow">
      <button class="btn btn-yes" id="yesBtn">Yes</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
  </div>
</div>

<!-- PAGE 3: YOU KNEW IT -->
<div class="page" id="knewIt">
  <div class="card">
    <!-- Put a second photo here if you want. Change "photo2.jpg" to your file name. -->
    <div class="photo-wrap"><img src="541eeffe3baf6593b2eb1639e31951cd.jpg" alt="Photo"></div>
    <h1>I knew you would miss me !</h1>
    <button class="btn btn-ghost" id="startOverBtn">Start Over</button>
  </div>
</div>

<!-- PAGE 4: LETTER -->
<div class="page" id="letterPage">
  <div>
    <div class="envelope-zone" id="envelopeZone">
      <div class="envelope-paper"></div>
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
      <div class="envelope-seal">💌</div>
    </div>
    <div class="envelope-hint" id="envelopeHint">اضغطي على الرسالة لفتحها 💌</div>

    <div class="letter-paper" id="letterPaper">
      <div id="letterText"></div>
      <div class="signature">لاحلى حور</div>
    </div>

    <button class="btn btn-ghost" id="toMusicBtn" style="display:none;margin-top:20px;">اسمعي الأغنية 🎵</button>
  </div>
</div>

<!-- PAGE 5: MUSIC -->
<div class="page" id="musicPage">
  <div class="card">
    <div class="music-icon" id="musicIcon">🎵</div>
    <div class="song-title" id="songTitleText"></div>
    <div class="bars" id="bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="play-btn" id="playBtn">▶</div>
    <audio id="audio" preload="none">
      <source src="song.mp3" type="audio/mpeg">
      <source src="song.mp4" type="audio/mp4">
      <source src="song.m4a" type="audio/mp4">
    </audio>
    <button class="btn btn-ghost" id="toGiftBtn">Your Gift 🎁</button>
  </div>
</div>

<!-- PAGE 6: YOUR GIFT -->
<div class="page" id="giftPage">
  <div class="card">
    <div class="bouquet-wrap" id="bouquetWrap">
      <svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" class="bouquet-svg">
        <!-- stems -->
        <g stroke="#4f7a4a" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M120 190 C 116 150, 96 140, 88 200"/>
          <path d="M120 190 C 124 150, 146 140, 154 200"/>
          <path d="M120 190 C 118 145, 118 120, 120 190"/>
          <path d="M120 190 C 108 155, 100 150, 70 195"/>
          <path d="M120 190 C 132 155, 140 150, 170 195"/>
        </g>
        <!-- leaves -->
        <g fill="#5c8a56">
          <ellipse cx="95" cy="175" rx="10" ry="5" transform="rotate(-35 95 175)"/>
          <ellipse cx="145" cy="175" rx="10" ry="5" transform="rotate(35 145 175)"/>
          <ellipse cx="120" cy="165" rx="9" ry="5" transform="rotate(0 120 165)"/>
        </g>
        <!-- roses -->
        <g>
          <!-- center rose -->
          <circle cx="120" cy="110" r="24" fill="#7a1030"/>
          <circle cx="120" cy="110" r="17" fill="#9c1c40"/>
          <circle cx="120" cy="110" r="10" fill="#c23a5e"/>
          <circle cx="120" cy="110" r="4" fill="#e8b98a"/>
          <!-- left rose -->
          <circle cx="80" cy="130" r="20" fill="#ff6fa5"/>
          <circle cx="80" cy="130" r="14" fill="#ff8fb8"/>
          <circle cx="80" cy="130" r="7" fill="#ffd2e2"/>
          <!-- right rose -->
          <circle cx="162" cy="130" r="20" fill="#ff6fa5"/>
          <circle cx="162" cy="130" r="14" fill="#ff8fb8"/>
          <circle cx="162" cy="130" r="7" fill="#ffd2e2"/>
          <!-- small accent rose left -->
          <circle cx="60" cy="160" r="13" fill="#e8b98a"/>
          <circle cx="60" cy="160" r="7" fill="#f6d9b0"/>
          <!-- small accent rose right -->
          <circle cx="180" cy="160" r="13" fill="#e8b98a"/>
          <circle cx="180" cy="160" r="7" fill="#f6d9b0"/>
        </g>
        <!-- wrap -->
        <path d="M60 195 L180 195 L200 250 L40 250 Z" fill="#f2e4d3" stroke="#e8b98a" stroke-width="2"/>
        <path d="M60 195 L180 195 L192 232 L48 232 Z" fill="#fdf6ee" opacity="0.5"/>
        <!-- ribbon bow -->
        <g transform="translate(120 200)">
          <path d="M0 0 C -18 -12, -24 6, 0 6 C 24 6, 18 -12, 0 0 Z" fill="#7a1030"/>
          <circle cx="0" cy="1" r="5" fill="#9c1c40"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
/* =================================
   EASY CUSTOMIZATION
   ================================= */
// Replace with your own letter text
const letterMessage = `دائما جنت انسان لطيف وحلو وطاقتج حلوة كلش وانت شخص اله اثر بحياتي يخليني دائما اذكرة بخير واتمنى يعيش حياته براحه وونسه وفرح ويبعد عنه كل سوء وكل شخص يريد يضره `;

// Replace with your song's title
const songTitle = "Our Song ❤️";
/* ================================= */

document.getElementById('letterText').textContent = letterMessage;
document.getElementById('songTitleText').textContent = songTitle;

/* ---------- PARTICLES ---------- */
function spawnParticles(){
  const container = document.getElementById('particles');
  const count = 26;
  for(let i=0;i<count;i++){
    const useHeart = Math.random() < 0.35;
    const el = document.createElement('div');
    const left = Math.random()*100;
    const duration = 8 + Math.random()*10;
    const delay = Math.random()*10;
    if(useHeart){
      el.className = 'heart-particle';
      el.textContent = '♥';
      el.style.fontSize = (10+Math.random()*10)+'px';
    } else {
      el.className = 'particle';
      const size = 3+Math.random()*5;
      el.style.width = size+'px';
      el.style.height = size+'px';
    }
    el.style.left = left+'%';
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = delay+'s';
    container.appendChild(el);
  }
}
spawnParticles();

/* ---------- PAGE NAVIGATION ---------- */
function goToPage(id){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active','show');
  });
  const target = document.getElementById(id);
  target.classList.add('active');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      target.classList.add('show');
    });
  });
}

/* ---------- PAGE 1: TYPING ANIMATION ---------- */
const fullText = "Hi, Princess 👑";
const fullTextChars = Array.from(fullText); // splits by real characters, keeps emoji intact
const typingContent = document.getElementById('typingContent');
const loadingRing = document.getElementById('loadingRing');
let charIndex = 0;

typingContent.textContent = ''; // make sure it starts empty

// make the loading page visible right away (it starts with only .active, needs .show for opacity)
requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
    document.getElementById('loading').classList.add('show');
  });
});

function typeChar(){
  if(charIndex <= fullTextChars.length){
    typingContent.textContent = fullTextChars.slice(0, charIndex).join('');
    charIndex++;
    setTimeout(typeChar, 110 + Math.random()*70);
  } else {
    loadingRing.classList.add('show');
    setTimeout(()=>{
      goToPage('home');
    }, 1400);
  }
}
setTimeout(typeChar, 600);

/* ---------- PAGE 2: YES / NO BUTTONS ---------- */
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const btnRow = document.getElementById('btnRow');
let noAttempts = 0;
const maxNoAttempts = 4;

const cardEl = document.querySelector('#home .card');

function moveNoButton(){
  // Clamp movement to stay fully inside the card, on any screen size.
  const cardRect = cardEl.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  noBtn.style.transform = 'none';
  const freshBtnRect = noBtn.getBoundingClientRect();

  const padding = 14; // keep clear of the card's edges
  const maxLeft = freshBtnRect.left - (cardRect.left + padding);
  const maxRight = (cardRect.right - padding) - freshBtnRect.right;
  const maxUp = freshBtnRect.top - (cardRect.top + padding);
  const maxDown = (cardRect.bottom - padding) - freshBtnRect.bottom;

  const x = Math.random() < 0.5
    ? -Math.min(Math.abs((Math.random())*60), Math.max(maxLeft, 0))
    : Math.min(Math.abs((Math.random())*60), Math.max(maxRight, 0));
  const y = Math.random() < 0.5
    ? -Math.min(Math.abs((Math.random())*30), Math.max(maxUp, 0))
    : Math.min(Math.abs((Math.random())*30), Math.max(maxDown, 0));

  noBtn.style.position = 'relative';
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function handleNoInteraction(e){
  if(noAttempts >= maxNoAttempts) return; // already turned into Yes, let its own click handler run
  e.preventDefault();
  noAttempts++;
  if(noAttempts >= maxNoAttempts){
    noBtn.textContent = 'نعم ❤️';
    noBtn.classList.remove('btn-no');
    noBtn.classList.add('btn-yes');
    noBtn.style.transform = 'none';
    noBtn.style.background = 'linear-gradient(135deg, var(--pink), var(--burgundy))';
    noBtn.style.color = '#fff';
    noBtn.style.boxShadow = '0 8px 25px rgba(255,111,165,0.35)';
    noBtn.onclick = ()=> goToPage('knewIt');
  } else {
    moveNoButton();
  }
}

// pointerdown covers touch taps and mouse clicks in one unified handler,
// so the dodge reacts immediately on phones too (not just on hover).
noBtn.addEventListener('pointerdown', handleNoInteraction);
window.addEventListener('resize', ()=>{
  if(noAttempts < maxNoAttempts) noBtn.style.transform = 'none';
});

yesBtn.addEventListener('click', ()=>{
  goToPage('knewIt');
});

/* ---------- PAGE 3 ---------- */
document.getElementById('startOverBtn').addEventListener('click', ()=>{
  goToPage('letterPage');
});

/* ---------- PAGE 4: ENVELOPE / LETTER ---------- */
const envelopeZone = document.getElementById('envelopeZone');
const letterPaper = document.getElementById('letterPaper');
const envelopeHint = document.getElementById('envelopeHint');
const toMusicBtn = document.getElementById('toMusicBtn');
let envelopeOpened = false;

envelopeZone.addEventListener('click', ()=>{
  if(envelopeOpened) return;
  envelopeOpened = true;
  envelopeZone.classList.add('open');
  envelopeHint.style.opacity = '0';
  setTimeout(()=>{
    envelopeZone.style.display = 'none';
    envelopeHint.style.display = 'none';
    letterPaper.classList.add('show');
    toMusicBtn.style.display = 'inline-block';
  }, 950);
});

toMusicBtn.addEventListener('click', ()=>{
  goToPage('musicPage');
});

/* ---------- PAGE 5: MUSIC ---------- */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const musicIcon = document.getElementById('musicIcon');
const bars = document.getElementById('bars');
let isPlaying = false;

playBtn.addEventListener('click', ()=>{
  if(!isPlaying){
    audio.play().catch(()=>{ /* file may be missing; ignore */ });
    isPlaying = true;
    playBtn.textContent = '❚❚';
    musicIcon.classList.add('playing');
    bars.classList.add('playing');
  } else {
    audio.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    musicIcon.classList.remove('playing');
    bars.classList.remove('playing');
  }
});

audio.addEventListener('ended', ()=>{
  isPlaying = false;
  playBtn.textContent = '▶';
  musicIcon.classList.remove('playing');
  bars.classList.remove('playing');
});

document.getElementById('toGiftBtn').addEventListener('click', ()=>{
  goToPage('giftPage');
});

/* ---------- PAGE 6: GIFT CELEBRATION ---------- */
let celebrationStarted = false;
const giftPageEl = document.getElementById('giftPage');
const observer = new MutationObserver(()=>{
  if(giftPageEl.classList.contains('active') && !celebrationStarted){
    celebrationStarted = true;
    startCelebration();
  }
});
observer.observe(giftPageEl, { attributes:true, attributeFilter:['class'] });

/* ---------- CELEBRATION: confetti + hearts ---------- */
function startCelebration(){
  const colors = ['#ff6fa5','#e8b98a','#ff9fc4','#7a1030','#ffffff'];
  const total = 60;
  for(let i=0;i<total;i++){
    setTimeout(()=>{
      const piece = document.createElement('div');
      const isHeart = Math.random() < 0.4;
      if(isHeart){
        piece.textContent = '♥';
        piece.style.color = colors[Math.floor(Math.random()*colors.length)];
        piece.style.fontSize = (12+Math.random()*10)+'px';
        piece.className = 'confetti-piece';
        piece.style.background = 'transparent';
      } else {
        piece.className = 'confetti-piece';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
      }
      piece.style.left = Math.random()*100+'vw';
      const duration = 3 + Math.random()*2.5;
      piece.style.animation = `confettiFall ${duration}s ease-in forwards`;
      document.body.appendChild(piece);
      setTimeout(()=> piece.remove(), duration*1000+200);
    }, i*70);
  }
  // repeat burst every few seconds
  setInterval(()=>{
    for(let i=0;i<20;i++){
      setTimeout(()=>{
        const piece = document.createElement('div');
        const isHeart = Math.random() < 0.5;
        if(isHeart){
          piece.textContent = '♥';
          piece.style.color = colors[Math.floor(Math.random()*colors.length)];
          piece.style.fontSize = (12+Math.random()*10)+'px';
          piece.className = 'confetti-piece';
          piece.style.background = 'transparent';
        } else {
          piece.className = 'confetti-piece';
          piece.style.background = colors[Math.floor(Math.random()*colors.length)];
          piece.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
        }
        piece.style.left = Math.random()*100+'vw';
        const duration = 3 + Math.random()*2.5;
        piece.style.animation = `confettiFall ${duration}s ease-in forwards`;
        document.body.appendChild(piece);
        setTimeout(()=> piece.remove(), duration*1000+200);
      }, i*80);
    }
  }, 4000);
}
</script>
